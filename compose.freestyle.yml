services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: webdoc
      POSTGRES_USER: webdoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - webdoc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webdoc -d webdoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://webdoc:${POSTGRES_PASSWORD}@postgres:5432/webdoc
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
    command: sh -c "pnpm migrate && pnpm start -- -H 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    volumes:
      - webdoc-media:/app/media

volumes:
  webdoc-postgres:
  webdoc-media:
