services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: webdoc
      POSTGRES_USER: webdoc
      POSTGRES_PASSWORD: webdoc
    ports:
      - "5432:5432"
    volumes:
      - webdoc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webdoc -d webdoc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  webdoc-postgres:
